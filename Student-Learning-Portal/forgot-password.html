<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Smart Student Learning Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">📘 Smart Student Learning Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            <li class="nav-item"><button id="themeToggle" class="btn btn-sm btn-outline-dark ms-lg-3">🌙 Dark</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="card-body">
              <h2 class="section-title text-center">Reset Password</h2>
              <p class="text-center text-muted mb-4">Provide your details to create a new password.</p>
              <div id="forgotMessage" class="alert d-none" role="alert"></div>
              <form id="forgotForm" novalidate>
                <div class="mb-3">
                  <label class="form-label">Student Name</label>
                  <input type="text" id="forgotName" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">School Name</label>
                  <select id="forgotSchool" class="form-select">
                    <option value="">Choose school</option>
                    <option value="Day Care Centre School">Day Care Centre School</option>
                    <option value="Guru Gobind Singh Public School">Guru Gobind Singh Public School</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">New Password</label>
                  <input type="password" id="forgotPassword" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirm Password</label>
                  <input type="password" id="forgotConfirmPassword" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Update Password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/forgot.js"></script>
  </body>
</html>
