<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">📘 EduMind AI</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container" style="padding-top:100px;">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card p-4">
            <h3 class="mb-3">Question Generator</h3>

            <div class="mb-3">
              <label class="form-label">Select School</label>
              <select id="schoolNameSelect" class="form-select mb-2">
                <option value="ssc">SSC Board</option>
                <option value="daycare">Day Care Centre School</option>
              </select>

              <label class="form-label">Select Subject</label>
              <select id="subjectSelect" class="form-select mb-2">
                <option value="general-science">General Science</option>
                <option value="mathematics">Mathematics</option>
              </select>

              <label class="form-label">Upload a .pdf or .txt file (or paste below)</label>
              <input id="fileInput" class="form-control mb-2" type="file" accept=".pdf,.txt" />
              <textarea id="pasteArea" class="form-control" rows="6" placeholder="Or paste the text content here"></textarea>
              <button id="parseBtn" class="btn btn-primary mt-2">Load Chapters</button>
            </div>

            <div id="chaptersSection" class="d-none">
              <div class="mb-3">
                <label class="form-label">Select Chapter</label>
                <select id="chapterSelect" class="form-select"></select>
              </div>

              <div class="mb-3 row gx-2">
                <div class="col-6">
                  <label class="form-label">Number of questions</label>
                  <input id="numQuestions" type="number" class="form-control" value="5" min="1" />
                </div>
                <div class="col-6 d-flex align-items-end">
                  <button id="generateBtn" class="btn btn-success w-100">Generate Questions</button>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Generated Questions (<span id="generatedCount">0</span>)</label>
                <div id="results" class="list-group"></div>
              </div>
            </div>

            <div id="parseError" class="alert alert-warning d-none"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="js/question-generator.js"></script>
  </body>
</html>
