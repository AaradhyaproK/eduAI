<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Smart Student Learning Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">📘 Smart Student Learning Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
            <li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><button id="themeToggle" class="btn btn-sm btn-outline-dark ms-lg-3">🌙 Dark</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="card-body">
              <h2 class="section-title text-center">Create New Student Account</h2>
              <p class="text-center text-muted mb-4">Register your child to begin learning with a personalized dashboard.</p>
              <div id="registerMessage" class="alert d-none" role="alert"></div>
              <form id="registerForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Student Name</label>
                    <input type="text" id="regName" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" id="regPassword" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Age</label>
                    <input type="number" id="regAge" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Standard</label>
                    <select id="regClass" class="form-select">
                      <option value="">Choose class</option>
                      <option value="Nursery">Nursery</option>
                      <option value="KG">KG</option>
                      <option value="Class 1">Class 1</option>
                      <option value="Class 2">Class 2</option>
                      <option value="Class 3">Class 3</option>
                      <option value="Class 4">Class 4</option>
                      <option value="Class 5">Class 5</option>
                      <option value="Class 6">Class 6</option>
                      <option value="Class 7">Class 7</option>
                      <option value="Class 8">Class 8</option>
                      <option value="Class 9">Class 9</option>
                      <option value="Class 10">Class 10</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">School</label>
                    <select id="regSchool" class="form-select">
                      <option value="">Choose school</option>
                      <option value="Day Care Centre School">Day Care Centre School</option>
                      <option value="Guru Gobind Singh Public School">Guru Gobind Singh Public School</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Parent Name</label>
                    <input type="text" id="regParent" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" id="regMobile" class="form-control" required />
                  </div>
                </div>
                <div class="mt-4 d-flex flex-wrap gap-2">
                  <button type="submit" class="btn btn-primary">Register</button>
                  <button type="reset" class="btn btn-outline-secondary">Reset</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
