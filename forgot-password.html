<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Smart Student Learning Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">📘 Smart Student Learning Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            <li class="nav-item"><button id="themeToggle" class="btn btn-sm btn-outline-dark ms-lg-3">🌙 Dark</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="card-body">
              <h2 class="section-title text-center">🔒 Reset Password via Email OTP</h2>
              <p class="text-center text-muted mb-4">Enter your username or email to receive a 6-digit security code.</p>
              <div id="forgotMessage" class="alert d-none" role="alert"></div>

              <!-- Step 1: Send OTP -->
              <form id="sendOtpForm">
                <div class="mb-3">
                  <label class="form-label fw-semibold">👤 Username / Email Address</label>
                  <input type="text" id="forgotUsername" class="form-control" placeholder="Enter your username or email" required />
                </div>
                <button type="submit" id="sendOtpBtn" class="btn btn-primary w-100 py-2 fw-semibold">📩 Send 6-Digit OTP Code</button>
              </form>

              <!-- Step 2: Enter OTP & Reset Password -->
              <form id="resetPasswordForm" class="d-none mt-3">
                <div class="mb-3">
                  <label class="form-label fw-semibold">🔑 Enter 6-Digit OTP Code</label>
                  <input type="text" id="otpInput" class="form-control text-center fs-4 letter-spacing-2" placeholder="123456" maxlength="6" required />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">🔒 New Password</label>
                  <input type="password" id="newPasswordInput" class="form-control" placeholder="Enter new password" required />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">🔒 Confirm New Password</label>
                  <input type="password" id="confirmNewPasswordInput" class="form-control" placeholder="Confirm new password" required />
                </div>
                <button type="submit" id="resetPasswordBtn" class="btn btn-success w-100 py-2 fw-semibold">✅ Update Password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/forgot.js"></script>
  </body>
</html>
