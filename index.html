<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="loader" class="loader-overlay d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">📘 EduMind AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link active" href="index.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><button id="themeToggle" class="btn btn-sm btn-outline-dark ms-lg-3">🌙 Dark</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="hero-section" id="loginSection">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-8">
            <div class="text-center mb-4">
              <h1 class="display-5 fw-bold mb-2">EduMind AI</h1>
              <p class="lead text-muted mb-0">Learn Smarter with AI</p>
              <h2 class="h4 fw-semibold mt-4">Welcome Back!</h2>
            </div>

            <div class="card shadow-lg border-0 rounded-4 p-4 auth-card">
              <div class="card-body">
                <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm" novalidate>
                  <div class="mb-3">
                    <label for="studentName" class="form-label">👤 Student ID / Username</label>
                    <input type="text" class="form-control" id="studentName" placeholder="Enter your username" />
                  </div>

                  <div class="mb-3">
                    <label for="studentPassword" class="form-label">🔒 Password</label>
                    <div class="input-group">
                      <input type="password" class="form-control" id="studentPassword" placeholder="Enter your password" />
                      <button class="btn btn-outline-secondary" type="button" id="togglePassword">👁</button>
                    </div>
                  </div>

                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe" />
                    <label class="form-check-label" for="rememberMe">Remember Me</label>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>

                  <div class="d-flex justify-content-between flex-wrap gap-2 auth-links">
                    <a href="forgot-password.html">Forgot Password?</a>
                    <a href="register.html">Create Account</a>
                  </div>

                  <div class="text-center my-3 auth-divider">---------------- OR ----------------</div>
                  <button type="button" class="btn btn-outline-dark w-100">Continue with Google</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <footer class="footer py-4 mt-5">
      <div class="container text-center">
        <h5 class="fw-bold">EduMind AI</h5>
        <p class="mb-1">© 2026 EduMind AI.</p>
        <p class="mb-0">Contact: support@smartportal.com | Instagram • Facebook • YouTube</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
