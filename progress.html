<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress | Smart Student Learning Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">📘 Smart Student Learning Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="subjects.html">Subjects</a></li>
            <li class="nav-item"><a class="nav-link active" href="progress.html">Progress</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" id="logoutLink" href="#">Logout</a></li>
            <li class="nav-item"><button id="themeToggle" class="btn btn-sm btn-outline-dark ms-lg-3">🌙 Dark</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card rounded-4 p-4 shadow-sm">
            <h2 class="section-title">Progress Overview</h2>
            <div class="progress mb-3">
              <div id="progressBar" class="progress-bar bg-success" style="width: 0%"></div>
            </div>
            <p>Completed Subjects: <strong id="progressSubjects">0</strong></p>
            <p>Highest Score: <strong id="progressBest">0%</strong></p>
            <p>Average Score: <strong id="progressAverage">0%</strong></p>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card rounded-4 p-4 shadow-sm">
            <h4 class="section-title">Achievement Badges</h4>
            <div class="d-flex flex-wrap gap-2" id="badges"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/progress.js"></script>
  </body>
</html>
