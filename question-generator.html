<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question Generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">📘 EduMind AI</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="subjects.html">Subjects</a></li>
            <li class="nav-item"><a class="nav-link active" href="question-generator.html">AI Question Generator</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container" style="padding-top:100px;">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card p-4 shadow-sm border-0 rounded-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h3 class="mb-0 fw-bold">✨ AI Question Generator</h3>
              <span class="badge bg-primary px-3 py-2">Gemini Flash AI</span>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Select School Board</label>
              <select id="schoolNameSelect" class="form-select mb-3">
                <option value="ssc">SSC Board</option>
                <option value="daycare">Day Care Centre School</option>
                <option value="ggsps">Guru Gobind Singh Public School</option>
              </select>

              <label class="form-label fw-semibold">Select Subject</label>
              <select id="subjectSelect" class="form-select mb-3">
                <option value="General Science">General Science</option>
                <option value="Mathematics">Mathematics</option>
                <option value="English">English</option>
                <option value="Social Studies">Social Studies</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Drawing & Art">Drawing & Art</option>
                <option value="General Knowledge">General Knowledge</option>
              </select>

              <label class="form-label fw-semibold">Upload a .pdf or .txt file (or paste textbook content below)</label>
              <input id="fileInput" class="form-control mb-3" type="file" accept=".pdf,.txt" />
              <textarea id="pasteArea" class="form-control mb-3" rows="6" placeholder="Or paste the chapter content / textbook notes here..."></textarea>
              <button id="parseBtn" class="btn btn-primary w-100 py-2 fw-semibold">📚 Load & Extract Chapters</button>
            </div>

            <div id="chaptersSection" class="d-none mt-4">
              <div class="mb-3">
                <label class="form-label fw-semibold">Select Chapter</label>
                <select id="chapterSelect" class="form-select"></select>
              </div>

              <div class="mb-3 row gx-2">
                <div class="col-6">
                  <label class="form-label fw-semibold">Number of questions</label>
                  <input id="numQuestions" type="number" class="form-control" value="5" min="1" max="25" />
                </div>
                <div class="col-6 d-flex align-items-end">
                  <button id="generateBtn" class="btn btn-success w-100 fw-semibold">✨ Generate Questions with AI</button>
                </div>
              </div>

              <div class="mb-3 mt-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <label class="form-label fw-bold mb-0">Generated Questions (<span id="generatedCount">0</span>)</label>
                  <span class="badge bg-light text-dark border">Powered by Gemini AI</span>
                </div>
                <div id="results" class="list-group"></div>
              </div>
            </div>

            <div id="parseError" class="alert alert-warning d-none"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/gemini-api.js"></script>
    <script src="/js/question-generator.js"></script>
  </body>
</html>
